<div id="footer">
  <div class="foot_inner inner">
    <!-- 원본은 흰 로고 파일(w_logo.png)이 박혀 있었다. 헤더와 같은 3단 폴백을 쓴다.
         ⚠️ 원본 foot_logo 에는 링크가 없다. <a> 로 감싸지 않는다 —
            감싸면 블록이 하나 더 생겨 20% 칸의 높이·정렬이 원본과 달라진다. -->
    <div class="foot_logo">
      <img src="data:," alt="" data-logo-image />
      <span class="logo_text tpl-slot" data-property-name-en></span>
    </div>
    <div class="foot_txt">
      <!-- data-* 속성 : data-footer-rural-stay-mark-wrap (customFields.footer.ruralStayMark 가 있을 때만 노출, 기본 숨김)
           data-footer-rural-stay-mark : 농어촌민박사업자 이미지 (표시마크 + 신고번호, alt = description) -->
      <div class="ft_rural_stay_mark_wrap" data-footer-rural-stay-mark-wrap style="display: none">
        <img class="ft_rural_stay_mark" src="" alt="농어촌민박사업자" data-footer-rural-stay-mark />
      </div>
      <p class="pension tpl-slot" data-footer-property-name></p>
      <p class="address tpl-slot" data-footer-address></p>
      <p class="owner">
        대표자 :
        <span class="tpl-slot" data-footer-representative></span>
        | 사업자 번호 :
        <span class="tpl-slot" data-footer-business-number></span>
      </p>
      <p class="policy">
        <a href="http://design.trip11.net/privacy/privacy_policy.html" target="_blank">
          개인정보처리방침
        </a>
      </p>
      <p class="policy" data-ybs-wrap>
        <a class="tpl-slot" href="#!" target="_blank" data-ybs-button>야놀자 YBS</a>
      </p>
      <p class="copyright">
        <a href="http://trip11.kr/" target="_blank" data-copyright="COPYRIGHT©{provider}. ALL RIGHTS RESERVED.">
          COPYRIGHT©(주)트립일레븐. ALL RIGHTS RESERVED.
        </a>
      </p>
    </div>
    <!-- ⚠️ `T.` 와 번호 사이에 공백을 두지 않는다. 원본이 `T.070-4630-6478` 이고
         .foot_tel 은 1200px 의 20%(=240px)뿐이라 30px 글자로 공백 한 칸이 더 들어가면
         줄이 넘어간다. prettier 가 개행하지 않도록 한 줄로 붙여 둔다. -->
    <div class="foot_tel">
      <!-- prettier-ignore -->
      <a class="tpl-slot" href="tel:" data-footer-phone-link>T.<span class="tpl-slot" data-footer-phone></span></a>
    </div>
  </div>
</div>

<!-- 우측 하단 플로팅 버튼 2개. 상담하기(아래) + 예약하기(위) 순으로 쌓인다.
     예약하기는 `for_m` 이라 모바일에서만 뜨고, 상담하기는 총판A + tripPropertyId 가
     있을 때 전 화면폭에서 뜬다 (header-footer-mapper.mapConsult). -->

<!-- data-* 속성 : data-consult-button (property.tripPropertyId + partnerType)
     상담 URL 은 `https://www.bookingplay.co.kr/api/cti_eicn/kakao_happy_talk?tid={tripPropertyId}` -->
<div id="talk_custom_button" data-consult-wrap>
  <a title="상담하기" href="#!" target="_blank" data-consult-button>
    <img src="images/common/consult.png" alt="상담하기" />
  </a>
</div>

<!-- data-* 속성 : data-booking-link (property.realtimeBookingId) -->
<div class="ft_btn_reserve for_m on">
  <a title="예약하기" href="#!" target="_blank" data-booking-link>
    <img src="images/common/talk.png" alt="예약하기" />
  </a>
</div>
